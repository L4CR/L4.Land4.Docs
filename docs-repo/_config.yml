title: LAND4 Knowledge
description: Espacio centralizado para procesos, guías y arquitectura de LAND4.
logo: "docs-repo/assets/images/L4.png"
color_scheme: land4

# Tema remoto para GitHub Pages
remote_theme: just-the-docs/just-the-docs

# Plugins necesarios para compilar en GitHub Pages
plugins:
  - jekyll-remote-theme

# Configuración del motor de búsqueda integrado
search_enabled: true
search:
  tokenizer: separator
  preview_words_before: 5
  preview_words_after: 5

# Enlaces auxiliares en la barra superior derecha
aux_links:
  "GitHub Repository": "https://github.com/L4CR/L4.docs-organizacion"

# Configuración de URL base para despliegue
url: "https://l4cr.github.io"
baseurl: "/L4.docs-organizacion"

# Configuración de diagramas Mermaid
mermaid:
  version: "10.1.0"

sass:
  sass_dir: docs-repo/_sass

# Archivos operativos del repositorio que no deben publicarse como páginas del portal
exclude:
  - .bundle/
  - .jekyll-cache/
  - .sass-cache/
  - .astro/
  - _site/
  - .tmp/
  - dist/
  - node_modules/
  - vendor/
  - docs-repo/vendor/
  - docs-repo/.bundle/
  - docs-repo/.jekyll-cache/
  - docs-repo/.sass-cache/
  - src/
  - prisma/
  - test/
  - coverage/
  - public/
  - .agents/
  - .github/
  - .vscode/
  - docs-repo/Gemfile
  - docs-repo/Gemfile.lock
  - docs-repo/docker-compose.yml
  - docs-repo/scripts/
