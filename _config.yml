title: LAND4 Knowledge
description: Espacio centralizado para procesos, guías y arquitectura de LAND4.
logo: "assets/images/L4.png"
color_scheme: land4

# Tema remoto para GitHub Pages
remote_theme: just-the-docs/just-the-docs

# Plugins necesarios para compilar en GitHub Pages
plugins:
  - jekyll-remote-theme

# Configuración del motor de búsqueda integrado
search_enabled: true
search:
  tokenizer: separator
  preview_words_before: 5
  preview_words_after: 5

# Enlaces auxiliares en la barra superior derecha
aux_links:
  "GitHub Repository": "https://github.com/L4CR/L4.docs-organizacion"

# Configuración de URL base para despliegue
url: ""

# Configuración de diagramas Mermaid
mermaid:
  version: "10.1.0"

# Archivos operativos del repositorio que no deben publicarse como páginas del portal
exclude:
  - AGENTS.md
  - .bundle/
  - .jekyll-cache/
  - _site/
  - vendor/
