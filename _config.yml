title: LAND4 knowledge
description: Espacio centralizado para procesos, guías y arquitectura de la Organización.
# 1. Reemplaza "theme" por "remote_theme" apuntando al repositorio oficial del tema
remote_theme: just-the-docs/just-the-docs

# 2. Activa el plugin necesario para que GitHub Pages acepte temas remotos
plugins:
  - jekyll-remote-theme

# Configuración del buscador nativo
search_enabled: true
search:
  tokenizer: separator
  preview_words_before: 5
  preview_words_after: 5

# Si tu repositorio es privado y usas GitHub Enterprise, la URL cambiará. 
# Por ahora, para la configuración base:
url: ""
